<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Planning — Feature Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #222636;
    --border: #2e3248; --accent: #6c63ff; --accent2: #00d4aa;
    --text: #e2e8f0; --text-muted: #8892a4; --radius: 8px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 13px; }

  header { background: linear-gradient(135deg,#1a1d27,#0f1117); border-bottom: 1px solid var(--border); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg,#6c63ff,#00d4aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; white-space: nowrap; }
  .header-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stat-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .stat-pill strong { color: var(--text); }

  .controls { padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 300px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  input[type=search], select { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 7px 12px; font-size: 12px; outline: none; transition: border-color .2s; }
  input[type=search] { padding-left: 32px; width: 100%; }
  input[type=search]:focus, select:focus { border-color: var(--accent); }
  select { cursor: pointer; min-width: 120px; }
  select option { background: #222636; }

  .btn { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-muted); padding: 7px 14px; font-size: 12px; cursor: pointer; transition: all .2s; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--border); color: var(--text); }
  .btn-green { border-color: #34d399; color: #34d399; }
  .btn-green:hover { background: #0d3d2a; color: #34d399; }
  .btn-blue { border-color: #60a5fa; color: #60a5fa; }
  .btn-blue:hover { background: #1e2f5a; color: #60a5fa; }
  .btn-purple { border-color: #a78bfa; color: #a78bfa; }
  .btn-purple:hover { background: #2a1f40; color: #a78bfa; }
  .count-badge { background: var(--accent); color: #fff; border-radius: 12px; padding: 2px 8px; font-size: 11px; font-weight: 600; margin-left: auto; }

  /* IMPORT BAR */
  .import-bar { padding: 12px 28px; background: #13162099; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .import-bar label { font-size: 12px; color: var(--text-muted); }
  #fileInput { display: none; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; font-size: 13px; display: none; gap: 10px; align-items: center; z-index: 999; box-shadow: 0 8px 24px #00000060; }
  .toast.show { display: flex; }
  .toast.success { border-color: #34d399; }
  .toast.error   { border-color: #f87171; }

  .table-wrap { overflow-x: auto; padding: 0 28px 28px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; min-width: 1400px; }
  thead th { background: var(--surface2); color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 10px 12px; border-bottom: 2px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 10; }
  thead th:hover { color: var(--text); background: #2a2e42; }
  thead th .sort-icon { margin-left: 4px; opacity: .4; }
  thead th.sorted .sort-icon { opacity: 1; color: var(--accent); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 10px 12px; vertical-align: middle; max-width: 220px; }
  tbody tr.new-row td:first-child { border-left: 3px solid #34d399; }
  tbody tr.updated-row td:first-child { border-left: 3px solid #fbbf24; }

  .detail-row { display: none; }
  .detail-row.open { display: table-row; }
  .detail-row td { background: #13162099; padding: 16px 20px; border-bottom: 2px solid var(--accent); }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
  .detail-item label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 3px; }
  .detail-item .val { color: var(--text); font-size: 12px; line-height: 1.5; }
  .dep-tag { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 11px; margin: 2px 2px 0 0; color: var(--accent2); }

  .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
  .s-completed   { background: #0d3d2a; color: #34d399; }
  .s-in-progress { background: #1e2f5a; color: #60a5fa; }
  .s-planned     { background: #2a1f40; color: #a78bfa; }
  .s-on-hold     { background: #3d2a0d; color: #fbbf24; }
  .s-cancelled   { background: #3a1a1a; color: #f87171; }
  .p-critical { background: #3a1a1a; color: #f87171; }
  .p-high     { background: #3a2a0d; color: #fb923c; }
  .p-medium   { background: #1e2a1e; color: #86efac; }
  .p-low      { background: #1a2a3a; color: #7dd3fc; }
  .phase-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; color: var(--text-muted); }
  .phase-launched    { border-color: #34d399; color: #34d399; }
  .phase-development { border-color: #60a5fa; color: #60a5fa; }
  .phase-qa          { border-color: #a78bfa; color: #a78bfa; }
  .phase-design      { border-color: #fb923c; color: #fb923c; }

  .progress-wrap { display: flex; align-items: center; gap: 8px; min-width: 90px; }
  .progress-bar { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width .3s; }
  .p100 { background: #34d399; } .p75 { background: #60a5fa; } .p50 { background: #fbbf24; } .p25 { background: #f87171; } .plow { background: #6b7280; }
  .progress-val { font-size: 11px; color: var(--text-muted); min-width: 30px; text-align: right; }

  .feat-num { font-family: "SF Mono","Fira Code",monospace; font-size: 11px; color: var(--accent); font-weight: 600; }
  .jira-id  { font-family: "SF Mono","Fira Code",monospace; font-size: 11px; color: var(--text-muted); }
  .feature-title { font-weight: 500; color: var(--text); cursor: pointer; }
  .feature-title:hover { color: var(--accent2); }
  .expand-icon { display: inline-block; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 3px; background: var(--surface2); border: 1px solid var(--border); font-size: 10px; color: var(--text-muted); transition: transform .2s; }
  .expand-icon.open { transform: rotate(90deg); color: var(--accent); border-color: var(--accent); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* legend */
  .legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-muted); align-items: center; flex-wrap: wrap; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; }
</style>
</head>
<body>

<header>
  <h1>Product Planning — Feature Tracker</h1>
  <div class="header-meta">
    <div class="stat-pill">Total <strong id="stat-total">100</strong></div>
    <div class="stat-pill">Completed <strong id="stat-done" style="color:#34d399"></strong></div>
    <div class="stat-pill">In Progress <strong id="stat-wip" style="color:#60a5fa"></strong></div>
    <div class="stat-pill">Planned <strong id="stat-plan" style="color:#a78bfa"></strong></div>
    <div class="stat-pill">On Hold <strong id="stat-hold" style="color:#fbbf24"></strong></div>
  </div>
</header>

<!-- IMPORT / EXPORT BAR -->
<div class="import-bar">
  <label>Excel Import / Export:</label>
  <button class="btn btn-green" onclick="document.getElementById('fileInput').click()">
    &#8679; Import CSV
  </button>
  <input type="file" id="fileInput" accept=".csv" onchange="importCSV(this)">
  <button class="btn btn-blue" onclick="exportCSV()">
    &#8681; Export to CSV (Excel)
  </button>
  <button class="btn btn-purple" onclick="downloadTemplate()">
    &#9112; Download Template CSV
  </button>
  <span id="importLegend" style="display:none" class="legend">
    <span><span class="legend-dot" style="background:#34d399"></span>New row added</span>
    <span><span class="legend-dot" style="background:#fbbf24"></span>Existing row updated</span>
  </span>
</div>

<!-- FILTERS -->
<div class="controls">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="searchBox" placeholder="Search features, tickets, leads…">
  </div>
  <select id="filterStatus"><option value="">All Status</option><option>Planned</option><option>In Progress</option><option>Completed</option><option>On Hold</option><option>Cancelled</option></select>
  <select id="filterPriority"><option value="">All Priority</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select>
  <select id="filterArea"><option value="">All Areas</option><option>Analytics</option><option>API</option><option>Auth</option><option>Billing</option><option>Dashboard</option><option>Integrations</option><option>Mobile</option><option>Notifications</option><option>Onboarding</option><option>Performance</option><option>Reporting</option><option>Search</option><option>Security</option><option>Settings</option><option>User Management</option></select>
  <select id="filterTeam"><option value="">All Teams</option><option>Backend</option><option>Data</option><option>Design</option><option>DevOps</option><option>Frontend</option><option>Full-Stack</option><option>Mobile</option><option>QA</option></select>
  <select id="filterPhase"><option value="">All Phases</option><option>Discovery</option><option>Design</option><option>Development</option><option>QA</option><option>Launched</option><option>On Hold</option><option>Cancelled</option></select>
  <button class="btn" onclick="resetFilters()">Reset</button>
  <span class="count-badge" id="countBadge">100</span>
</div>

<div class="table-wrap">
  <table id="featureTable">
    <thead>
      <tr>
        <th></th>
        <th onclick="sortBy('feature_number')" data-col="feature_number"># <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('feature_title')" data-col="feature_title">Feature Title <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('current_status')" data-col="current_status">Status <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('priority')" data-col="priority">Priority <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('product_area')" data-col="product_area">Area <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('assigned_team')" data-col="assigned_team">Team <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('current_phase')" data-col="current_phase">Phase <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('progress_percent')" data-col="progress_percent">Progress <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('story_points')" data-col="story_points">SP <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('start_date')" data-col="start_date">Start <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('target_release_date')" data-col="target_release_date">Release <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('engineering_lead')" data-col="engineering_lead">Lead <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('jira_ticket_id')" data-col="jira_ticket_id">Ticket <span class="sort-icon">↕</span></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none">
    <p style="margin-top:12px">No features match your filters.</p>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><span id="toastMsg"></span></div>

let newRows = new Set();
let updatedRows = new Set();

// ── CSV HELPERS ───────────────────────────────────────────────────────
function csvCell(v) {
  const s = String(v === null || v === undefined ? "" : v);
  return (s.includes(",") || s.includes('"') || s.includes("\n"))
    ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCSV(rows) {
  const header = COLUMNS.join(",");
  const lines = rows.map(f =>
    COLUMNS.map(col => {
      let v = f[col];
      if (col === "dependencies") v = Array.isArray(v) ? v.join("|") : (v || "");
      return csvCell(v);
    }).join(",")
  );
  return "\uFEFF" + header + "\r\n" + lines.join("\r\n"); // BOM for Excel UTF-8
}

function parseCSV(text) {
  // strip BOM
  text = text.replace(/^\uFEFF/, "");
  const lines = [];
  let cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if ((ch === "\r" || ch === "\n") && !inQ) {
      if (ch === "\r" && text[i+1] === "\n") i++;
      lines.push(cur); cur = "";
    } else cur += ch;
  }
  if (cur) lines.push(cur);

  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = [], buf = [];
    let q = false;
    for (let i = 0; i <= line.length; i++) {
      const c = line[i];
      if (c === '"') { if (q && line[i+1]==='"'){buf.push('"');i++;}else q=!q; }
      else if ((c === "," || i === line.length) && !q) { vals.push(buf.join("")); buf.length=0; }
      else buf.push(c);
    }
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] !== undefined ? vals[i] : "");
    return obj;
  });
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], {type: mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ── IMPORT ────────────────────────────────────────────────────────────
function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const rows = parseCSV(e.target.result);
      if (!rows.length) { showToast("CSV file is empty or unreadable.", "error"); return; }
      if (!Object.keys(rows[0]).includes("feature_number")) {
        showToast("Missing required column: feature_number", "error"); return;
      }

      let added = 0, updated = 0;
      const existingMap = {};
      DATA.forEach((f, i) => existingMap[f.feature_number] = i);

      rows.forEach(row => {
        const fn = String(row.feature_number || "").trim();
        if (!fn) return;

        let deps = String(row.dependencies || "").trim();
        const depsArr = deps ? deps.split("|").map(s => s.trim()).filter(Boolean) : [];

        if (fn in existingMap) {
          const idx = existingMap[fn];
          COLUMNS.forEach(col => {
            const val = row[col];
            if (val === undefined || val === "") return;
            if (col === "dependencies") DATA[idx][col] = depsArr;
            else if (col === "story_points" || col === "progress_percent") DATA[idx][col] = Number(val) || 0;
            else DATA[idx][col] = val;
          });
          updatedRows.add(fn); updated++;
        } else {
          DATA.push({
            feature_number: fn,
            feature_title:        row.feature_title        || "",
            current_status:       row.current_status       || "Planned",
            target_release_date:  row.target_release_date  || "",
            priority:             row.priority             || "Medium",
            assigned_team:        row.assigned_team        || "",
            product_area:         row.product_area         || "",
            story_points:         Number(row.story_points) || 0,
            sprint_quarter:       row.sprint_quarter       || "",
            start_date:           row.start_date           || "",
            progress_percent:     Number(row.progress_percent) || 0,
            current_phase:        row.current_phase        || "",
            dependencies:         depsArr,
            jira_ticket_id:       row.jira_ticket_id       || "",
            stakeholder_requester:row.stakeholder_requester|| "",
            engineering_lead:     row.engineering_lead     || "",
            limitation:           row.limitation           || "",
            documentation:        row.documentation        || ""
          });
          existingMap[fn] = DATA.length - 1;
          newRows.add(fn); added++;
        }
      });

      document.getElementById("importLegend").style.display = added + updated > 0 ? "flex" : "none";
      updateStats(); render();
      showToast(`Import complete — ${added} added, ${updated} updated.`, "success");
      input.value = "";
    } catch(err) {
      showToast("Failed to parse CSV: " + err.message, "error");
    }
  };
  reader.readAsText(file, "UTF-8");
}

// ── EXPORT ────────────────────────────────────────────────────────────
function exportCSV() {
  const rows = sorted(filtered());
  downloadBlob(toCSV(rows), "features_data.csv", "text/csv;charset=utf-8;");
  showToast("Exported features_data.csv — open in Excel.", "success");
}

// ── TOAST ─────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.className = "toast show " + (type || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast", 3500);
}

// ── TABLE ─────────────────────────────────────────────────────────────
let sortCol = "feature_number", sortAsc = true;
let openRows = new Set();

const statusClass   = {Completed:"s-completed","In Progress":"s-in-progress",Planned:"s-planned","On Hold":"s-on-hold",Cancelled:"s-cancelled"};
const priorityClass = {Critical:"p-critical",High:"p-high",Medium:"p-medium",Low:"p-low"};
const phaseClass    = {Launched:"phase-launched",Development:"phase-development",QA:"phase-qa",Design:"phase-design"};
function pcls(p) { return p===100?"p100":p>=75?"p75":p>=50?"p50":p>=25?"p25":"plow"; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function filtered() {
  const q  = document.getElementById("searchBox").value.toLowerCase();
  const st = document.getElementById("filterStatus").value;
  const pr = document.getElementById("filterPriority").value;
  const ar = document.getElementById("filterArea").value;
  const tm = document.getElementById("filterTeam").value;
  const ph = document.getElementById("filterPhase").value;
  return DATA.filter(f => {
    if (st && f.current_status !== st) return false;
    if (pr && f.priority !== pr) return false;
    if (ar && f.product_area !== ar) return false;
    if (tm && f.assigned_team !== tm) return false;
    if (ph && f.current_phase !== ph) return false;
    if (q) {
      const hay = [f.feature_number,f.feature_title,f.engineering_lead,f.jira_ticket_id,
                   f.stakeholder_requester,f.product_area,f.assigned_team,f.limitation,f.documentation
                  ].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function sorted(arr) {
  return [...arr].sort((a,b) => {
    let av=a[sortCol],bv=b[sortCol];
    if (typeof av==="number") return sortAsc?av-bv:bv-av;
    return sortAsc?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));
  });
}

function render() {
  const data = sorted(filtered());
  const body = document.getElementById("tableBody");
  document.getElementById("countBadge").textContent = data.length;
  document.getElementById("emptyState").style.display = data.length ? "none" : "block";

  body.innerHTML = data.map(f => {
    const idx    = f.feature_number;
    const isOpen = openRows.has(idx);
    const deps   = (f.dependencies||[]).length
      ? f.dependencies.map(d=>`<span class="dep-tag">${esc(d)}</span>`).join("")
      : `<span style="color:var(--text-muted)">None</span>`;
    const rowCls = newRows.has(idx) ? "new-row" : updatedRows.has(idx) ? "updated-row" : "";
    return `
    <tr class="row-expand ${rowCls}" onclick="toggleDetail('${idx}')">
      <td><span class="expand-icon ${isOpen?"open":""}" id="icon-${idx}">&rsaquo;</span></td>
      <td><span class="feat-num">${esc(f.feature_number)}</span></td>
      <td class="feature-title" style="max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(f.feature_title)}">${esc(f.feature_title)}</td>
      <td><span class="badge ${statusClass[f.current_status]||""}">${esc(f.current_status)}</span></td>
      <td><span class="badge ${priorityClass[f.priority]||""}">${esc(f.priority)}</span></td>
      <td style="color:var(--text-muted)">${esc(f.product_area)}</td>
      <td style="color:var(--text-muted)">${esc(f.assigned_team)}</td>
      <td><span class="phase-badge ${phaseClass[f.current_phase]||""}">${esc(f.current_phase)}</span></td>
      <td><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill ${pcls(f.progress_percent)}" style="width:${f.progress_percent}%"></div></div><span class="progress-val">${f.progress_percent}%</span></div></td>
      <td style="text-align:center;color:var(--text-muted)">${f.story_points}</td>
      <td style="color:var(--text-muted);white-space:nowrap">${esc(f.start_date)}</td>
      <td style="color:var(--text-muted);white-space:nowrap">${esc(f.target_release_date)}</td>
      <td style="white-space:nowrap">${esc(f.engineering_lead)}</td>
      <td><span class="jira-id">${esc(f.jira_ticket_id)}</span></td>
    </tr>
    <tr class="detail-row ${isOpen?"open":""}" id="detail-${idx}">
      <td colspan="14">
        <div class="detail-grid">
          <div class="detail-item"><label>Sprint / Quarter</label><div class="val">${esc(f.sprint_quarter)}</div></div>
          <div class="detail-item"><label>Stakeholder</label><div class="val">${esc(f.stakeholder_requester)}</div></div>
          <div class="detail-item"><label>Dependencies</label><div class="val">${deps}</div></div>
          <div class="detail-item"><label>Limitation</label><div class="val">${esc(f.limitation)}</div></div>
          <div class="detail-item" style="grid-column:span 2"><label>Documentation</label><div class="val">${esc(f.documentation)}</div></div>
        </div>
      </td>
    </tr>`;
  }).join("");
}

function toggleDetail(idx) {
  const d=document.getElementById("detail-"+idx), i=document.getElementById("icon-"+idx);
  if (!d) return;
  if (openRows.has(idx)) { openRows.delete(idx); d.classList.remove("open"); i.classList.remove("open"); }
  else { openRows.add(idx); d.classList.add("open"); i.classList.add("open"); }
}

function sortBy(col) {
  sortAsc = sortCol===col ? !sortAsc : true;
  sortCol = col;
  document.querySelectorAll("thead th").forEach(th => {
    th.classList.remove("sorted");
    const ic=th.querySelector(".sort-icon"); if(ic) ic.textContent="↕";
  });
  const th=document.querySelector(`thead th[data-col="${col}"]`);
  if(th){ th.classList.add("sorted"); const ic=th.querySelector(".sort-icon"); if(ic) ic.textContent=sortAsc?"↑":"↓"; }
  render();
}

function resetFilters() {
  document.getElementById("searchBox").value="";
  ["filterStatus","filterPriority","filterArea","filterTeam","filterPhase"].forEach(id=>document.getElementById(id).value="");
  render();
}

function updateStats() {
  const cnt=s=>DATA.filter(f=>f.current_status===s).length;
  document.getElementById("stat-total").textContent=DATA.length;
  document.getElementById("stat-done").textContent=cnt("Completed");
  document.getElementById("stat-wip").textContent=cnt("In Progress");
  document.getElementById("stat-plan").textContent=cnt("Planned");
  document.getElementById("stat-hold").textContent=cnt("On Hold");
}

["searchBox","filterStatus","filterPriority","filterArea","filterTeam","filterPhase"]
  .forEach(id=>document.getElementById(id).addEventListener("input",render));

updateStats();
render();
</script>
